<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reasons I Love You, Mariah 💗</title>
<style>
:root{
  --deep:#ff6fa3; --mid:#ff94bd; --soft:#ffc2d8;
  --text:#6b2942; --textsoft:#9a4d67; --cream:#fffafb;
  --shadow:0 10px 40px rgba(255,111,163,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:ui-rounded,"Segoe UI","SF Pro Rounded","Trebuchet MS",system-ui,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 20%,#ffe0ef 0,transparent 45%),
    radial-gradient(circle at 85% 15%,#ffd1e7 0,transparent 40%),
    radial-gradient(circle at 50% 85%,#ffc4dd 0,transparent 50%),
    linear-gradient(160deg,#fff0f6 0,#ffd6e8 45%,#ffbfd9 100%);
  background-attachment:fixed;
  min-height:100vh;overflow-x:hidden;position:relative;
}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#particles{z-index:0}
#kitties{z-index:999;perspective:1000px}
.wrap{
  position:relative;z-index:1;max-width:720px;margin:0 auto;
  padding:2.5rem 1.25rem 4rem;display:flex;flex-direction:column;
  align-items:center;gap:2rem;
}
.title{text-align:center}
.title h1{
  font-size:clamp(1.6rem,5vw,2.8rem);font-weight:800;letter-spacing:-.5px;
  color:var(--deep);line-height:1.2;
  text-shadow:0 2px 0 #fff,0 6px 24px rgba(255,111,163,.35);
}
.hd{color:var(--mid);font-size:.8em;vertical-align:middle;display:inline-block;animation:pulse 1.8s ease-in-out infinite}
.hd:last-child{animation-delay:.9s}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.sub{margin-top:.5rem;font-size:clamp(.9rem,2.5vw,1.05rem);color:var(--textsoft);font-weight:600}
.card{
  width:100%;background:var(--cream);border-radius:28px;padding:2.2rem 1.6rem 2rem;
  box-shadow:var(--shadow),0 0 0 3px rgba(255,255,255,.7);border:2px solid #fff;
  display:flex;flex-direction:column;align-items:center;gap:1.2rem;position:relative;
}
.photo-slot{
  display:flex;align-items:center;justify-content:center;
  width:100%;min-height:0;transition:min-height .35s ease;
}
.photo-slot.has-photo{min-height:280px}

/* Faster fade — 0.35s instead of 0.8s */
.photo-frame{
  display:block;
  background:#fff;padding:12px 12px 38px;border-radius:8px;
  box-shadow:0 8px 30px rgba(255,111,163,.28),0 2px 6px rgba(0,0,0,.08);
  transform:rotate(-2deg) scale(.95);
  opacity:0;
  transition:opacity .35s ease, transform .35s cubic-bezier(.22,1.4,.36,1);
  position:relative;max-width:260px;
  pointer-events:none;
}
.photo-frame.visible{
  opacity:1;
  transform:rotate(var(--rot,-2deg)) scale(1);
}
.photo-frame img{display:block;width:100%;max-height:300px;object-fit:cover;border-radius:4px;background:var(--soft)}
.photo-frame::before{
  content:"";position:absolute;top:-10px;left:50%;width:60px;height:22px;
  background:rgba(255,148,189,.75);transform:translateX(-50%) rotate(-3deg);
  border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.1);
}
.rzone{min-height:6.5rem;display:flex;align-items:center;justify-content:center;width:100%}
.rtext{
  font-size:clamp(1.15rem,3.6vw,1.65rem);font-weight:700;line-height:1.45;
  text-align:center;color:var(--deep);max-width:26ch;
  opacity:1;transform:translateY(0);
  transition:opacity .3s ease, transform .3s cubic-bezier(.22,1,.36,1);
}
.rtext.empty{color:var(--textsoft);font-weight:600;font-size:clamp(1rem,3vw,1.2rem)}
.rtext.out{opacity:0;transform:translateY(6px)}
.counter{font-size:.9rem;font-weight:700;color:var(--mid);letter-spacing:.4px}
.btn{
  font-family:inherit;font-size:clamp(1.05rem,3vw,1.25rem);font-weight:800;color:#fff;
  background:linear-gradient(160deg,var(--mid),var(--deep));border:none;border-radius:999px;
  padding:1rem 2.4rem;min-height:56px;cursor:pointer;
  box-shadow:0 6px 0 #e0477f,0 12px 28px rgba(255,111,163,.42);
  transition:transform .14s ease,box-shadow .14s ease,filter .14s ease,opacity .4s ease;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
.btn:hover{filter:brightness(1.06);transform:translateY(-2px)}
.btn:active{transform:translateY(3px)}
.btn.fade-out{opacity:0;pointer-events:none;transform:translateY(10px)}
.particle{position:absolute;bottom:-60px;will-change:transform,opacity;user-select:none;line-height:1}
.particle.heart{animation:driftUp linear forwards}
.particle.star{animation:twinkleUp linear forwards}
.particle.sparkle{animation:sparkleUp ease-out forwards}
@keyframes driftUp{0%{transform:translateY(0) translateX(0) rotate(0) scale(.6);opacity:0}12%{opacity:.95}50%{transform:translateY(-55vh) translateX(22px) rotate(12deg) scale(1);opacity:.95}100%{transform:translateY(-115vh) translateX(-18px) rotate(-12deg) scale(.8);opacity:0}}
@keyframes twinkleUp{0%{transform:translateY(0) translateX(0) rotate(0) scale(.4);opacity:0}15%{opacity:1}35%{transform:translateY(-30vh) translateX(-14px) rotate(40deg) scale(1.1);opacity:1}70%{transform:translateY(-75vh) translateX(16px) rotate(-30deg) scale(.9);opacity:.7}100%{transform:translateY(-115vh) translateX(0) rotate(0) scale(.5);opacity:0}}
@keyframes sparkleUp{0%{transform:scale(.2) rotate(0);opacity:0}30%{transform:scale(1.4) rotate(90deg);opacity:1}60%{transform:scale(.9) rotate(180deg);opacity:.8}100%{transform:scale(.2) rotate(270deg);opacity:0}}
.kitty-wrap{position:absolute;bottom:20px;will-change:left;transform-style:preserve-3d;animation:walkAcross var(--walk-dur,10s) linear forwards}
.kitty{width:100%;height:100%;transform-style:preserve-3d;transform-origin:bottom center;animation:bounce3d var(--bounce-dur,1s) ease-in-out infinite alternate}
.kitty svg{display:block;width:100%;height:100%;filter:drop-shadow(0 20px 15px rgba(255,111,163,.4));transform:rotateX(15deg)}
@keyframes walkAcross{from{left:var(--start-x)}to{left:var(--end-x)}}
@keyframes bounce3d{0%{transform:scaleY(.85) scaleX(1.1) translateY(0)}100%{transform:scaleY(1) scaleX(1) translateY(-30px) rotateX(10deg)}}
.kitty.flip{transform:scaleX(-1)}
.kitty.flip svg{transform:rotateX(15deg) scaleX(-1)}
@media (max-width:420px){
  .wrap{padding:1.6rem .9rem 3rem;gap:1.5rem}
  .card{padding:1.6rem 1.1rem 1.5rem;border-radius:22px}
  .rzone{min-height:5.5rem}
  .btn{padding:.9rem 1.9rem}
  .photo-frame{max-width:210px}
  .photo-slot.has-photo{min-height:230px}
}
</style>
</head>
<body>

<div id="particles" class="fx" aria-hidden="true"></div>
<div id="kitties" class="fx" aria-hidden="true"></div>

<main class="wrap">
  <header class="title">
    <h1><span class="hd">♡</span> Reasons I Love You, Mariah <span class="hd">♡</span></h1>
    <p class="sub">hey cutie. click the button 💕</p>
  </header>

  <section class="card" aria-live="polite">
    <div id="photo-slot" class="photo-slot">
      <div id="photo-frame" class="photo-frame">
        <img id="photo-img" alt="us" />
      </div>
    </div>
    <div class="rzone">
      <p id="reason" class="rtext empty">press the button to begin 💕</p>
    </div>
    <p id="counter" class="counter" hidden></p>
    <button id="btn" class="btn" type="button">Show me 💕</button>
  </section>
</main>

<script>
/* ===== 1. REASONS ===== */
var REASONS = [
  "I love the way you talk",
  "I love the way you compliment me constantly",
  "I love the way you look",
  "I love the way you laugh at your own jokes",
  "I love the way you always call me handsome",
  "I love the way you always give me confidence",
  "I love the way you are so perfect in every way.",
  "I love the way you are a tsundere",
  "I love the way you get all flustered from my compliments"
];

/* ===== 2. PHOTOS ===== */
var PHOTOS = ["1.png", "2.png", "3.jpeg", "4.png", "5.png"];

/* ===== 3. TIMING (tuned for speed) =====
   AUTOPLAY_SPEED = how long each reason stays fully visible
   FADE_MS        = fade duration (must match CSS .3s transitions)
   Total per cycle ≈ AUTOPLAY_SPEED + FADE_MS (fade out) + FADE_MS (fade in) */
var AUTOPLAY_SPEED = 1100;   /* 1.1s hold */
var FADE_MS = 300;           /* 0.3s fades */

/* ===== 4. ENGINE ===== */
var reasonEl=document.getElementById("reason"),counterEl=document.getElementById("counter"),
    btnEl=document.getElementById("btn"),
    slotEl=document.getElementById("photo-slot"),frameEl=document.getElementById("photo-frame"),
    imgEl=document.getElementById("photo-img"),particlesEl=document.getElementById("particles"),
    kittiesEl=document.getElementById("kitties");

var idx = -1;
var photoIdx = -1;
var animating = false;
var autoplayStarted = false;
var autoplayTimer = null;

for(var pi=0;pi<PHOTOS.length;pi++){(function(s){var im=new Image();im.src=s;})(PHOTOS[pi]);}

/* ---------- photo swap (fade out -> swap -> fade in) ---------- */
function setPhoto(step){
  if(!PHOTOS || PHOTOS.length===0) return;
  var src = PHOTOS[step % PHOTOS.length];

  frameEl.classList.remove("visible");

  setTimeout(function(){
    imgEl.onerror = function(){ slotEl.classList.remove("has-photo"); };
    imgEl.onload = function(){
      slotEl.classList.add("has-photo");
      frameEl.style.setProperty("--rot", (Math.random()*8-4).toFixed(1)+"deg");
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){ frameEl.classList.add("visible"); });
      });
    };
    imgEl.src = src;
  }, FADE_MS);
}

/* ---------- reason swap ---------- */
function setReason(i, cb){
  animating = true;
  reasonEl.classList.add("out");

  setTimeout(function(){
    reasonEl.textContent = REASONS[i];
    reasonEl.classList.remove("empty");
    counterEl.hidden = false;
    counterEl.textContent = (i+1) + " of " + REASONS.length;

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        reasonEl.classList.remove("out");
        setTimeout(function(){
          animating = false;
          if(cb) cb();
        }, FADE_MS);
      });
    });
  }, FADE_MS);
}

function step(nextIndex, nextPhotoIndex, cb){
  if(animating) return;
  setReason(nextIndex, cb);
  setPhoto(nextPhotoIndex);
}

/* ---------- manual phase ---------- */
btnEl.addEventListener("click", function(){
  if(autoplayStarted || animating) return;

  if(idx === REASONS.length - 1){
    startAutoplay();
    return;
  }

  idx++;
  photoIdx++;

  step(idx, photoIdx, function(){
    if(idx === 0){ btnEl.textContent = "One more 💕"; }
    if(idx === REASONS.length - 1){ btnEl.textContent = "Keep going 💕"; }
  });
});

/* ---------- autoplay ---------- */
function startAutoplay(){
  autoplayStarted = true;
  btnEl.classList.add("fade-out");
  setTimeout(function(){ btnEl.style.display = "none"; }, 400);

  idx = 0;
  photoIdx = 0;

  step(idx, photoIdx, function(){ scheduleNext(); });
}

function scheduleNext(){
  autoplayTimer = setTimeout(function(){
    idx = (idx + 1) % REASONS.length;
    photoIdx = (photoIdx + 1) % PHOTOS.length;
    step(idx, photoIdx, function(){ scheduleNext(); });
  }, AUTOPLAY_SPEED);
}

/* ---------- particles ---------- */
var HEARTS=["♥","♡","💕","💗","💖","🩷"],STARS=["✦","✧","⋆","✿","❀","★"],
    SPARKS=["✩","✨","·","˚","✫"],PINKS=["#ff6fa3","#ff94bd","#ffc2d8","#ffb0cc","#ff7fac","#ffd6e8"];
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function spawnParticle(){
  var p=document.createElement("span"),r=Math.random();
  if(r<0.55){p.className="particle heart";p.textContent=pick(HEARTS);p.style.fontSize=(16+Math.random()*28)+"px";p.style.color=pick(PINKS);var d=6+Math.random()*7;p.style.animationDuration=d+"s";p.style.left=Math.random()*100+"vw";particlesEl.appendChild(p);setTimeout(function(){p.remove();},(d+1)*1000);}
  else if(r<0.85){p.className="particle star";p.textContent=pick(STARS);p.style.fontSize=(10+Math.random()*16)+"px";p.style.color=pick(PINKS);var d2=8+Math.random()*8;p.style.animationDuration=d2+"s";p.style.left=Math.random()*100+"vw";particlesEl.appendChild(p);setTimeout(function(){p.remove();},(d2+1)*1000);}
  else{p.className="particle sparkle";p.textContent=pick(SPARKS);p.style.fontSize=(14+Math.random()*22)+"px";p.style.color=pick(PINKS);p.style.left=Math.random()*100+"vw";p.style.bottom=(Math.random()*85)+"vh";var d3=1.4+Math.random()*1.6;p.style.animationDuration=d3+"s";particlesEl.appendChild(p);setTimeout(function(){p.remove();},(d3+.5)*1000);}
}

/* ---------- 3D kitties ---------- */
var KITTY_SVG='<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><polygon points="14,22 20,6 28,20" fill="#fff0f5" stroke="#6b2942" stroke-width="2" stroke-linejoin="round"/><polygon points="50,22 44,6 36,20" fill="#fff0f5" stroke="#6b2942" stroke-width="2" stroke-linejoin="round"/><polygon points="17,20 21,11 25,19" fill="#ffb3cd"/><polygon points="47,20 43,11 39,19" fill="#ffb3cd"/><ellipse cx="32" cy="36" rx="21" ry="18" fill="#fff" stroke="#6b2942" stroke-width="2"/><circle cx="24" cy="34" r="2.8" fill="#6b2942"/><circle cx="40" cy="34" r="2.8" fill="#6b2942"/><circle cx="19" cy="40" r="3.2" fill="#ffb3cd" opacity=".85"/><circle cx="45" cy="40" r="3.2" fill="#ffb3cd" opacity=".85"/><path d="M30 39 L34 39 L32 42 Z" fill="#ff6fa3"/><path d="M32 42 Q28 46 26 44" fill="none" stroke="#6b2942" stroke-width="1.6" stroke-linecap="round"/><path d="M32 42 Q36 46 38 44" fill="none" stroke="#6b2942" stroke-width="1.6" stroke-linecap="round"/><line x1="8" y1="36" x2="18" y2="37" stroke="#6b2942" stroke-width="1.2" stroke-linecap="round"/><line x1="8" y1="40" x2="18" y2="40" stroke="#6b2942" stroke-width="1.2" stroke-linecap="round"/><line x1="56" y1="36" x2="46" y2="37" stroke="#6b2942" stroke-width="1.2" stroke-linecap="round"/><line x1="56" y1="40" x2="46" y2="40" stroke="#6b2942" stroke-width="1.2" stroke-linecap="round"/></svg>';
var MIN_K=4,MAX_K=10,active=0;
function spawnKitty(){
  if(active>=MAX_K)return;
  var wrap=document.createElement("div");wrap.className="kitty-wrap";
  var inner=document.createElement("div");inner.className="kitty";inner.innerHTML=KITTY_SVG;
  var size=60+Math.random()*50;wrap.style.width=size+"px";wrap.style.height=size+"px";
  inner.style.setProperty("--bounce-dur",(0.6+Math.random()*0.4)+"s");
  var dirLeft=Math.random()<0.5,walkDur=6+Math.random()*6;
  if(dirLeft){wrap.style.setProperty("--start-x","100vw");wrap.style.setProperty("--end-x","-120px");inner.classList.add("flip");}
  else{wrap.style.setProperty("--start-x","-120px");wrap.style.setProperty("--end-x","100vw");}
  wrap.style.setProperty("--walk-dur",walkDur+"s");
  wrap.appendChild(inner);kittiesEl.appendChild(wrap);active++;
  setTimeout(function(){if(wrap.parentNode)wrap.parentNode.removeChild(wrap);active--;},walkDur*1000+500);
}

for(var i=0;i<20;i++)setTimeout(spawnParticle,i*40);
for(var j=0;j<MIN_K;j++)setTimeout(spawnKitty,j*1500);
setInterval(function(){if(document.hidden)return;spawnParticle();if(Math.random()<.35)spawnParticle();},340);
setInterval(function(){if(document.hidden)return;if(active<MIN_K&&Math.random()<0.5)spawnKitty();},2000);
</script>
</body>
</html>
